    tasks.register("runAssembly${phase.capitalize()}", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
        outputs.upToDateWhen { false }
        installerVersion = '1.1.2'
        runDir = layout.buildDirectory.dir('run/assemblyCrash').get().asFile
        jvmArgs.add('-Dfabric-api.gametest')
        jvmArgs.add("-Dfabric-api.gametest.filter=tumble_test:assembly_restart_game_tests_${phase.replaceAll('([a-z])([A-Z])', '\$1_\$2').toLowerCase(Locale.ROOT)}")
        jvmArgs.add("-Dtumble.restart.phase=${phase}")
        jvmArgs.add("-Dtumble.restart.flush=${providers.gradleProperty('assemblyCrashFlush').getOrElse('none')}")
        doFirst {
            if (!providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)) {
