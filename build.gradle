plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

group = 'cc.modlabs'
version = "${mod_version}+${minecraft_version}"

repositories {
    mavenCentral()
    maven { url = 'https://repo-api.modlabs.cc/repo/maven/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation include("cc.modlabs:box3d4j:${box3d4j_version}")
    implementation project(':physics-core')
    include project(':physics-core')
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.4.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        tumble {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tumble_test'
        enableClientGameTests = true
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}

tasks.named('runGameTest') {
    doFirst { project.delete(layout.buildDirectory.dir('run/gameTest/world')) }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft_version: minecraft_version }
}

jar {
    from('LICENSE') { rename { 'LICENSE-tumble' } }
}

tasks.named("test") { useJUnitPlatform() }

// Verify the downloadable mod, including the native platforms, rather than only the dev classpath.
tasks.register('verifyModJar') {
    dependsOn tasks.jar
    doLast {
        def jarFile = tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            def core = names.find { it.startsWith('META-INF/jars/physics-core-') && it.endsWith('.jar') }
            def nativeJar = names.find { it.startsWith('META-INF/jars/box3d4j-') && it.endsWith('.jar') }
            assert core && nativeJar && names.contains('LICENSE-tumble') : 'Mod JAR is missing its core, native library or license'
            def expected = [
                'cc/modlabs/box3d/global/Box3D.class',
                'cc/modlabs/box3d/linux-x86_64/libjniBox3D.so',
                'cc/modlabs/box3d/windows-x86_64/jniBox3D.dll',
                'cc/modlabs/box3d/macosx-x86_64/libjniBox3D.dylib',
                'cc/modlabs/box3d/macosx-arm64/libjniBox3D.dylib'
            ] as Set
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry(nativeJar))).withCloseable { nested ->
                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) expected.remove(entry.name)
            }
            assert expected.isEmpty() : "Native JAR is missing: ${expected}"
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyModJar') }

// Run the built mod and separate test mod with the normal Fabric server launcher.
def gametestJar = tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}
dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    productionRuntimeMods "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    productionRuntimeMods files(tasks.jar)
    productionRuntimeMods files(gametestJar)
}
tasks.register('runProductionGameTest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    outputs.upToDateWhen { false }
    installerVersion = '1.1.2'
    runDir = layout.buildDirectory.dir('run/productionGameTest').get().asFile
    jvmArgs.add('-Dfabric-api.gametest')
    doFirst {
        if (!providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)) {
            throw new GradleException('Pass -PacceptMinecraftEula=true to accept the Minecraft EULA for tests')
        }
        def directory = runDir.get().asFile
        directory.mkdirs()
        project.delete(new File(directory, 'world'))
        new File(directory, 'eula.txt').text = 'eula=true\n'
    }
}

// These tests temporarily replace the server runtime and must not share a process with other tests.
[
    clear: 'tumble_test:assembly_game_tests_clear_retains_props_when_removal_journal_prepare_fails',
    shutdown: 'tumble_test:tumble_game_tests_stopping_server_retains_props_after_physics_runtime_detaches'
].each { name, filter ->
    tasks.register("runIsolated${name.capitalize()}GameTest", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
        outputs.upToDateWhen { false }
        installerVersion = '1.1.2'
        runDir = layout.buildDirectory.dir("run/isolated-${name}").get().asFile
        jvmArgs.add('-Dfabric-api.gametest')
        jvmArgs.add("-Dfabric-api.gametest.filter=${filter}")
        jvmArgs.add("-Dtumble.isolated.test=${name}")
        doFirst {
            if (!providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)) {
                throw new GradleException('Pass -PacceptMinecraftEula=true to accept the Minecraft EULA for tests')
            }
            def directory = runDir.get().asFile
            directory.mkdirs()
            project.delete(new File(directory, 'world'))
            new File(directory, 'eula.txt').text = 'eula=true\n'
        }
    }
}
tasks.register('runRecoveryLifecycleTests') {
    dependsOn tasks.named('runIsolatedClearGameTest'), tasks.named('runIsolatedShutdownGameTest')
}
if (!providers.gradleProperty('tumbleSkipRecoveryLifecycle').map { it.toBoolean() }.getOrElse(false)) {
    tasks.named('runProductionGameTest') { finalizedBy tasks.named('runRecoveryLifecycleTests') }
}

// Both processes use the same world. Only the prepare phase removes a previous run.
['prepare', 'verify'].each { phase ->
    tasks.register("runAssemblyRestart${phase.capitalize()}", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
        outputs.upToDateWhen { false }
        installerVersion = '1.1.2'
        runDir = layout.buildDirectory.dir('run/assemblyRestart').get().asFile
        jvmArgs.add('-Dfabric-api.gametest')
        jvmArgs.add("-Dfabric-api.gametest.filter=tumble_test:assembly_restart_game_tests_${phase}")
        jvmArgs.add("-Dtumble.restart.phase=${phase}")
        doFirst {
            if (!providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)) {
                throw new GradleException('Pass -PacceptMinecraftEula=true to accept the Minecraft EULA for tests')
            }
            def directory = runDir.get().asFile
            directory.mkdirs()
            if (phase == 'prepare') {
                project.delete(new File(directory, 'world'), new File(directory, 'assembly-restart-id.txt'))
            }
            new File(directory, 'eula.txt').text = 'eula=true\n'
        }
    }
}
tasks.named('runAssemblyRestartVerify') { mustRunAfter tasks.named('runAssemblyRestartPrepare') }
tasks.register('runAssemblyRestartTest') {
    dependsOn tasks.named('runAssemblyRestartPrepare'), tasks.named('runAssemblyRestartVerify')
}

